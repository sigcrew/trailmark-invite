<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Trailmark 여행에 초대받았어요. 앱에서 열어 함께 기록해보세요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trailmark">
  <meta property="og:title" content="Trailmark 여행 초대">
  <meta property="og:description" content="여행에 초대받았어요. 앱에서 열어 함께 기록해보세요.">
  <title>Trailmark 여행 초대</title>
  <style>
    :root {
      color: #12232b;
      background: #f4f7f9;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f9; }
    main {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 56px 20px calc(48px + env(safe-area-inset-bottom));
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 28px;
      color: #0e3a4a;
      font-size: 14px;
      font-weight: 750;
    }
    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 10px;
      background: #0e3a4a;
      color: #ffffff;
      font-size: 17px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.3; letter-spacing: -0.01em; }
    p { margin: 0; color: #5c6e76; font-size: 15px; line-height: 1.6; }
    .card {
      margin-top: 28px;
      padding: 22px 20px;
      border: 1px solid #d3dde1;
      border-radius: 18px;
      background: #ffffff;
    }
    .button {
      display: block;
      margin-top: 18px;
      padding: 15px 16px;
      border-radius: 14px;
      background: #0e3a4a;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .note { margin-top: 14px; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span>Trailmark</span>
    </div>

    <section id="invite" hidden>
      <h1>여행에 초대받았어요</h1>
      <p>Trailmark 앱에서 열면 초대한 여행을 확인하고 함께할 수 있어요.</p>
      <div class="card">
        <p>앱이 설치되어 있다면 아래 버튼을 눌러주세요.</p>
        <a class="button" id="open" href="#">Trailmark에서 열기</a>
        <p class="note">버튼을 눌러도 열리지 않으면 Trailmark 앱을 설치한 뒤 이 링크를 다시 열어주세요.</p>
      </div>
    </section>

    <section id="invalid" hidden>
      <h1>초대 링크를 확인할 수 없어요</h1>
      <p>링크가 잘렸을 수 있어요. 초대한 사람에게 링크를 다시 받아주세요.</p>
    </section>

    <noscript>
      <h1>여행에 초대받았어요</h1>
      <p>이 페이지는 자바스크립트가 필요해요. 브라우저에서 다시 열어주세요.</p>
    </noscript>
  </main>

  <script>
    (function () {
      // The code sits after "#", so it is never sent to the server.
      var fromHash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
      var fromQuery = new URLSearchParams(location.search).get("code") || "";
      var code = (fromHash || fromQuery).trim();
      var valid = /^[A-Za-z0-9]{8,64}$/.test(code);
      document.getElementById(valid ? "invite" : "invalid").hidden = false;
      if (valid) {
        document.getElementById("open").href = "trailmark://trip-invite/" + encodeURIComponent(code);
      }
    })();
  </script>
</body>
</html>
